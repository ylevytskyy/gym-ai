# Fills in the profile and lands on the Health tab. Start from the onboarding screen.
appId: app.aurafit.mobile
---
- assertVisible:
    id: onboarding
# Values offered from the health store are declined here; this flow types its own.
- runFlow:
    when:
      visible:
        id: dismiss-suggestion
    commands:
      - tapOn:
          id: dismiss-suggestion
- tapOn: "Age range: 35-44"
- tapOn:
    id: weight-input
- inputText: "78"
# Put the keyboard away: the Done key on iOS, the system key on Android.
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: "Goal: Move more"
- tapOn: "Goal: Move more"
- scrollUntilVisible:
    element: "Level: Beginner"
- tapOn: "Level: Beginner"
- scrollUntilVisible:
    element: "Injuries to work around: Knee"
- tapOn: "Injuries to work around: Knee"
- scrollUntilVisible:
    element:
      id: save-profile
- tapOn:
    id: save-profile
- extendedWaitUntil:
    visible:
      id: today
    timeout: 15000
- tapOn:
    id: tab-health
- extendedWaitUntil:
    visible:
      id: health-settings
    timeout: 10000
