# Deletes the signed-in account from the Privacy and account screen and ends on the sign-in
# screen. Only for a throwaway account: everything stored about it is deleted for good.
appId: app.aurafit.mobile
---
- tapOn:
    id: tab-health
- scrollUntilVisible:
    element:
      id: open-privacy
    direction: DOWN
- tapOn:
    id: open-privacy
- scrollUntilVisible:
    element:
      id: delete-account
    direction: DOWN
- tapOn:
    id: delete-account
- tapOn: "Delete account"
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 30000
